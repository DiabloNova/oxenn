name: Phase 1 remediation execution (temporary)
on:
  push:
    branches:
      - 'fix/audit-remediation-p1-v1.1'

permissions:
  contents: write

concurrency:
  group: phase1-remediation-${ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve lockfile and run Phase 1 gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --timeout 5s
          --health-retries 5

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and run acceptance gates
        id: gates
        shell: bash
        run: |
          set +e
          EVIDENCE_DIR="$RUNNER_TEMP/phase1-remediation-evidence"
          export EVIDENCE_DIR
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "Node: $(node --version)" "pnpm: $(pnpm --version)" "Commit under test: $GITHUB_SHA" "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$EVIDENCE_DIR/environment.txt"

          run_capture() {
            name="$1"
            shift
            printf '\n==> %s\n' "$name"
            "$@" > "$EVIDENCE_DIR/$name.log" 2>&1
            rc=$?
            printf '%s\n' "$rc" > "$EVIDENCE_DIR/$name.exit"
            printf '%s (exit %s)\n' "$name" "$rc"
            tail -n 80 "$EVIDENCE_DIR/$name.log" 2>/dev/null
            return 0
          }

          skip_gate() {
            name="$1"
            reason="$2"
            printf '%s\n' "SKIPPED: $reason" > "$EVIDENCE_DIR/$name.log"
            printf '%s\n' "125" > "$EVIDENCE_DIR/$name.exit"
            echo "SKIPPED $name: $reason"
          }

          pnpm install --no-frozen-lockfile > "$EVIDENCE_DIR/install.log" 2>&1
          INSTALL_RC=$?
          printf '%s\n' "$INSTALL_RC" > "$EVIDENCE_DIR/install.exit"
          echo "pnpm install --no-frozen-lockfile exit: $INSTALL_RC"
          tail -n 100 "$EVIDENCE_DIR/install.log"

          if grep -E 'ERR_PNPM_PEER_DEP_ISSUES|ERR_PNPM_PEER_DEP_ISSUE' "$EVIDENCE_DIR/install.log" >/dev/null; then
            echo "1" > "$EVIDENCE_DIR/install-peer-errors.exit"
            echo "Peer dependency error signature detected."
          else
            echo "0" > "$EVIDENCE_DIR/install-peer-errors.exit"
            echo "No fatal pnpm peer-dependency error signature detected."
          fi

          # pnpm audit may return non-zero because advisories exist; policy is decided
          # by audit-gate.mjs. Keep raw JSON in its own evidence file.
          pnpm audit --json > "$EVIDENCE_DIR/pnpm-audit.json" 2> "$EVIDENCE_DIR/pnpm-audit.stderr"
          AUDIT_RAW_RC=$?
          printf '%s\n' "$AUDIT_RAW_RC" > "$EVIDENCE_DIR/pnpm-audit-command.exit"
          if [ -s "$EVIDENCE_DIR/pnpm-audit.json" ]; then
            run_capture audit-gate bash -c 'node scripts/audit-gate.mjs --stdin < "$1"' _ "$EVIDENCE_DIR/pnpm-audit.json"
          else
            printf '%s\n' "pnpm audit returned no JSON; see pnpm-audit.stderr." > "$EVIDENCE_DIR/audit-gate.log"
            printf '%s\n' "2" > "$EVIDENCE_DIR/audit-gate.exit"
          fi

          if [ "$INSTALL_RC" -eq 0 ]; then
            run_capture dependency-why-brace-expansion pnpm why brace-expansion
            run_capture dependency-why-source-map-js pnpm why source-map-js
            run_capture dependency-why-braces pnpm why braces
            run_capture dependency-tree pnpm list --depth Infinity --json

            cat > "$RUNNER_TEMP/check-resolution-floors.mjs" <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          let root;
          try { root = JSON.parse(raw); } catch { console.error('pnpm list output is not valid JSON'); process.exit(2); }
          const wanted = new Map([['brace-expansion', []], ['source-map-js', []]]);
          function walk(value, inheritedName = '') {
            if (Array.isArray(value)) { for (const item of value) walk(item); return; }
            if (!value || typeof value !== 'object') return;
            const name = typeof value.name === 'string' ? value.name : inheritedName;
            if (wanted.has(name) && typeof value.version === 'string') wanted.get(name).push(value.version);
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'name' && key !== 'version') walk(child, key);
            }
          }
          walk(root);
          const tuple = (v) => v.split(/[.+-]/).slice(0, 3).map(n => Number.parseInt(n, 10) || 0);
          const cmp = (a, b) => {
            const x = tuple(a), y = tuple(b);
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
            return 0;
          };
          let failed = false;
          const brace = wanted.get('brace-expansion');
          console.log('brace-expansion resolved versions:', [...new Set(brace)].join(', ') || '(none found)');
          if (!brace.length) { console.error('Could not verify any brace-expansion resolution'); failed = true; }
          for (const version of brace) {
            const major = tuple(version)[0];
            const floor = major === 1 ? '1.1.21' : major === 2 ? '2.1.7' : major === 3 ? '3.0.9' : major === 4 ? null : '5.0.12';
            if (!floor || cmp(version, floor) < 0) {
              console.error('brace-expansion@' + version + ' is below the approved patched floor or remains on vulnerable 4.x');
              failed = true;
            }
          }
          const maps = wanted.get('source-map-js');
          console.log('source-map-js resolved versions:', [...new Set(maps)].join(', ') || '(none found)');
          if (!maps.length) { console.error('Could not verify any source-map-js resolution'); failed = true; }
          for (const version of maps) if (cmp(version, '1.2.2') < 0) {
            console.error('source-map-js@' + version + ' is below the patched 1.2.2 floor');
            failed = true;
          }
          if (failed) process.exit(1);
          console.log('Resolution floors PASS');
          NODE
            run_capture resolution-floors node "$RUNNER_TEMP/check-resolution-floors.mjs" "$EVIDENCE_DIR/dependency-tree.log"

            run_capture typecheck pnpm typecheck
            run_capture lint pnpm lint

            cat > "$RUNNER_TEMP/check-lint-budget.mjs" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          const text = fs.readFileSync(file, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
          const summaries = [...text.matchAll(/(\d+)\s+problems?\s*\(\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?\s*\)/gi)];
          let errors = 0, warnings = 0;
          if (summaries.length) {
            const m = summaries.at(-1);
            errors = Number(m[2]); warnings = Number(m[3]);
          } else if (/\bwarning\b/i.test(text)) {
            console.error('Could not reliably parse ESLint problem summary; lint budget is unverified');
            process.exit(2);
          }
          console.log('ESLint errors=' + errors + '; warnings=' + warnings + '; budget=218');
          if (errors > 0 || warnings > 218) process.exit(1);
          NODE
            run_capture lint-budget node "$RUNNER_TEMP/check-lint-budget.mjs" "$EVIDENCE_DIR/lint.log"

            run_capture unit-tests pnpm test:unit
            cat > "$RUNNER_TEMP/check-unit-baseline.mjs" <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.argv[2], 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
          const passed = [...text.matchAll(/\b(\d+)\s+passed\b/gi)].map(m => Number(m[1]));
          const maxPassed = passed.length ? Math.max(...passed) : 0;
          const fileSummary = text.split(/\r?\n/).filter(line => /^\s*Test Files\b/i.test(line)).at(-1) || '(Test Files summary not found)';
          console.log('Maximum reported passed count=' + maxPassed + '; baseline minimum=164');
          console.log('Test-file summary: ' + fileSummary);
          if (maxPassed < 164) process.exit(1);
          NODE
            run_capture unit-baseline node "$RUNNER_TEMP/check-unit-baseline.mjs" "$EVIDENCE_DIR/unit-tests.log"

            run_capture ui-tests pnpm test:ui
            cat > "$RUNNER_TEMP/check-ui-baseline.mjs" <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.argv[2], 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
          const passed = [...text.matchAll(/\b(\d+)\s+passed\b/gi)].map(m => Number(m[1]));
          const maxPassed = passed.length ? Math.max(...passed) : 0;
          console.log('Maximum reported passed count=' + maxPassed + '; baseline minimum=3');
          if (maxPassed < 3) process.exit(1);
          NODE
            run_capture ui-baseline node "$RUNNER_TEMP/check-ui-baseline.mjs" "$EVIDENCE_DIR/ui-tests.log"

            run_capture drizzle-check pnpm exec drizzle-kit check
            run_capture rls-migration-coverage pnpm db:verify-rls-migrations
            run_capture tenant-table-alignment pnpm exec tsx scripts/database/verify-tenant-tables.ts
            run_capture build pnpm build

            cat > "$RUNNER_TEMP/check-route-manifest.mjs" <<'NODE'
          import fs from 'node:fs';
          const path = '.next/server/app-paths-manifest.json';
          if (!fs.existsSync(path)) { console.error(path + ' missing after build'); process.exit(1); }
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const keys = Object.keys(manifest);
          const inngest = keys.filter(key => key.includes('/api/inngest'));
          console.log('Inngest manifest entries:', inngest.join(', ') || '(none)');
          if (!inngest.length) process.exit(1);
          NODE
            run_capture route-manifest node "$RUNNER_TEMP/check-route-manifest.mjs"

            run_capture image-optimizer-smoke bash -c '
              set +e
              pnpm start > "$EVIDENCE_DIR/production-server.log" 2>&1 &
              server_pid=$!
              trap "kill $server_pid >/dev/null 2>&1 || true" EXIT
              ready=0
              for i in $(seq 1 45); do
                code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ 2>/dev/null)
                if [ "$code" != "000" ]; then ready=1; break; fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "Production server did not become ready"; tail -n 100 "$EVIDENCE_DIR/production-server.log"; exit 1
              fi
              code=$(curl -sS -o "$EVIDENCE_DIR/next-image-response.bin" -w "%{http_code}" "http://127.0.0.1:3000/_next/image?url=%2Fplaceholder.jpg&w=64&q=75")
              echo "GET /_next/image?url=%2Fplaceholder.jpg&w=64&q=75 => HTTP $code"
              [ "$code" = "200" ] || { tail -n 100 "$EVIDENCE_DIR/production-server.log"; exit 1; }
            '

            run_capture isolation-suite env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/isolation_test_db MIGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/isolation_test_db pnpm run test:isolation
            run_capture docs-matrix pnpm run docs:matrix
          else
            for name in dependency-why-brace-expansion dependency-why-source-map-js dependency-why-braces dependency-tree resolution-floors typecheck lint lint-budget unit-tests unit-baseline ui-tests ui-baseline drizzle-check rls-migration-coverage tenant-table-alignment build route-manifest image-optimizer-smoke isolation-suite docs-matrix; do
              skip_gate "$name" "pnpm install failed with exit $INSTALL_RC"
            done
          fi

          mkdir -p verification/phase1-remediation
          {
            echo "# Phase 1 remediation execution evidence"
            echo
            echo "- Kit: oxenn-remediation-kit v1.1"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit initially tested: $GITHUB_SHA"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- Production database: none used; isolation suite uses the disposable GitHub Actions PostgreSQL service."
            echo "- Raw pnpm audit command exit (may be non-zero when advisories exist): $AUDIT_RAW_RC"
            echo "- Install exit: $INSTALL_RC"
            echo
            echo "| Gate / evidence command | Exit |"
            echo "|---|---:|"
            for f in "$EVIDENCE_DIR"/*.exit; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .exit)
              value=$(cat "$f")
              printf '| %s | %s |\n' "$name" "$value"
            done
            echo
            echo "Full command output and unmodified pnpm audit JSON are attached as the workflow artifact phase1-remediation-evidence."
            echo "A gate passes only when its exit code is 0. Skipped gates are recorded as 125 and are not accepted."
          } > verification/phase1-remediation/EXECUTION-REPORT.md

          cat verification/phase1-remediation/EXECUTION-REPORT.md >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/phase1-remediation-execution.yml
          if [ "$INSTALL_RC" -eq 0 ]; then
            git add pnpm-lock.yaml
          fi
          git add verification/phase1-remediation/EXECUTION-REPORT.md
          git commit -m "chore(deps): reconcile Phase 1 lockfile and record gates"
          COMMIT_RC=$?
          if [ "$COMMIT_RC" -eq 0 ]; then
            git push origin "HEAD:$GITHUB_REF_NAME"
            PUSH_RC=$?
          else
            PUSH_RC=1
          fi
          printf '%s\n' "$COMMIT_RC" > "$EVIDENCE_DIR/evidence-commit.exit"
          printf '%s\n' "$PUSH_RC" > "$EVIDENCE_DIR/evidence-push.exit"
          echo "Evidence commit exit: $COMMIT_RC; push exit: $PUSH_RC"

          # Do not fail before artifact upload; the last step enforces gate status.
          exit 0

      - name: Upload complete execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-remediation-evidence
          path: |
            ${ runner.temp }}/phase1-remediation-evidence/**
            verification/phase1-remediation/EXECUTION-REPORT.md
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Phase 1 acceptance gates
        if: always()
        shell: bash
        run: |
          set -e
          EVIDENCE_DIR="$RUNNER_TEMP/phase1-remediation-evidence"
          failed=0
          for f in "$EVIDENCE_DIR"/*.exit; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .exit)
            value=$(cat "$f")
            if [ "$name" = "pnpm-audit-command" ]; then
              continue
            fi
            if [ "$value" != "0" ]; then
              echo "FAIL: $name (exit $value)"
              failed=1
            else
              echo "PASS: $name"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Phase 1 gates failed or were skipped. See uploaded evidence."
            exit 1
          fi
          echo "All recorded Phase 1 gates passed."
