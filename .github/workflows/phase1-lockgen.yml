name: Phase 1 dependency lockfile validation

on:
  push:
    branches:
      - fix/audit-phase1-lockgen
    # Only workflow edits start a run. Dependency/patch commits created by this
    # workflow therefore cannot race it or create an install/commit loop.
    paths:
      - .github/workflows/phase1-lockgen.yml

permissions:
  contents: write

jobs:
  resolve-and-validate:
    name: Resolve lockfile and run Phase 1 gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Resolve dependencies and apply reviewed braces backport
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts/phase1"
          mkdir -p "$OUT"
          pnpm install --no-frozen-lockfile 2>&1 | tee "$OUT/pnpm-install.log"

          # ESLint 10 is deferred until eslint-config-next's plugins declare
          # compatible peer ranges. Apply the upstream-reviewed depth guard
          # at the exact pinned PR commit below; no application source is changed.
          PATCH_DIR="/tmp/oxenn-braces-3.0.3"
          pnpm patch braces@3.0.3 --edit-dir "$PATCH_DIR"
          UPSTREAM="https://raw.githubusercontent.com/FSDevelop/braces/28d440b5dd449dbf1fe6f3506cf94ecca4d02660/lib"
          for file in compile.js constants.js expand.js parse.js stringify.js; do
            curl --fail --silent --show-error --location "$UPSTREAM/$file" -o "$PATCH_DIR/lib/$file"
          done
          pnpm patch-commit "$PATCH_DIR" 2>&1 | tee "$OUT/braces-patch-commit.log"

          # Re-resolve after registering the local patch and updates/overrides.
          pnpm install --no-frozen-lockfile 2>&1 | tee -a "$OUT/pnpm-install.log"

          # Exercise the patched transitive package installed by pnpm.
          BRACES_CONSTANTS="$(grep -l 'MAX_DEPTH: 100' node_modules/.pnpm/braces@3.0.3*/node_modules/braces/lib/constants.js 2>/dev/null | head -n 1)"
          test -n "$BRACES_CONSTANTS"
          BRACES_PACKAGE="$GITHUB_WORKSPACE/${BRACES_CONSTANTS%/lib/constants.js}" node > "$OUT/braces-smoke-test.log" 2>&1 <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const pkg = process.env.BRACES_PACKAGE;
          const braces = require(pkg);
          const parse = require(path.join(pkg, 'lib/parse.js'));
          const hostile = '{'.repeat(101) + 'a,b' + '}'.repeat(101);
          assert.throws(() => braces(hostile), /exceeds max depth/i);
          assert.throws(() => parse(hostile), /exceeds max depth/i);
          assert.deepEqual(braces.expand('{a,b}'), ['a', 'b']);
          console.log('braces backport smoke tests passed: excessive nesting rejected; valid expansion preserved');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml patches
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch remaining Phase 1 advisories"
            git push origin HEAD:fix/audit-phase1-lockgen
          fi

      - name: Run Phase 1 validation commands
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/artifacts/phase1"
          mkdir -p "$OUT"
          printf 'gate\texit_code\n' > "$OUT/exit-codes.tsv"

          run_gate() {
            name="$1"
            shift
            "$@" > "$OUT/$name.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> "$OUT/exit-codes.tsv"
            echo "$name exit code: $code"
          }

          run_gate pnpm-audit pnpm audit --json
          run_gate typecheck pnpm typecheck
          run_gate test-unit pnpm test:unit
          # Diagnostic repeat only for the existing time-sensitive host-spacing test.
          # This result is recorded separately and never overwrites the full-suite result.
          run_gate test-http-provider-isolated pnpm exec vitest run --project unit tests/unit/features/acquisition/http-provider.test.ts
          run_gate test-ui pnpm test:ui
          run_gate build pnpm build
          run_gate lint pnpm lint
          run_gate why-undici pnpm why undici
          run_gate why-axios pnpm why axios
          run_gate why-js-yaml pnpm why js-yaml
          run_gate why-grpc pnpm why @grpc/grpc-js
          run_gate why-brace-expansion pnpm why brace-expansion
          run_gate why-braces pnpm why braces
          run_gate why-source-map-js pnpm why source-map-js

          if [[ -f .next/server/app-paths-manifest.json ]]; then
            OUT="$OUT" node -e 'const fs=require("node:fs"); const m=require("./.next/server/app-paths-manifest.json"); const ks=Object.keys(m); const rows=ks.filter(k=>/api\/inngest|image/i.test(k)); fs.writeFileSync(process.env.OUT+"/route-manifest-check.txt", "Relevant app paths:\n"+rows.join("\n")+"\n"); console.log(rows.join("\n")); process.exit(ks.some(k=>/api\/inngest/i.test(k))?0:1)'
            route_code=$?
          else
            echo "Missing .next/server/app-paths-manifest.json" > "$OUT/route-manifest-check.txt"
            route_code=1
          fi
          printf 'route-manifest-check\t%s\n' "$route_code" >> "$OUT/exit-codes.tsv"

          {
            echo '# Phase 1 validation summary'
            echo
            echo "- Commit checked out by workflow: $GITHUB_SHA"
            echo "- Node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo
            echo '## Exit codes'
            echo
            echo '| Gate | Exit code |'
            echo '|---|---:|'
            awk -F '\t' 'NR > 1 { printf "| %s | %s |\n", $1, $2 }' "$OUT/exit-codes.tsv"
            echo
            echo '## Audit severity summary and high findings'
            node -e 'const fs=require("fs");const p=process.argv[1];try{const j=JSON.parse(fs.readFileSync(p,"utf8"));console.log(JSON.stringify(j.metadata?.vulnerabilities??j.vulnerabilities??{note:"No known vulnerability summary field"},null,2));for(const a of Object.values(j.advisories??{})){if(["critical","high"].includes(a.severity)) console.log(a.severity+" | "+a.module_name+" | "+a.title+" | "+a.url)}}catch(e){console.log("Audit JSON parsing failed: "+e.message)}' "$OUT/pnpm-audit.log"
            echo
            echo '## Unit test summary'
            grep -E '(^|[[:space:]])(Test Files|Tests|Duration|FAIL|ERROR)([[:space:]]|$)' "$OUT/test-unit.log" | tail -n 20 || true
            echo
            echo '## Isolated HTTP provider test (diagnostic)'
            cat "$OUT/test-http-provider-isolated.log" | tail -n 50 || true
            echo
            echo '## UI test summary'
            grep -E '(^|[[:space:]])(Test Files|Tests|Duration|FAIL|ERROR)([[:space:]]|$)' "$OUT/test-ui.log" | tail -n 20 || true
            echo
            echo '## Lint summary'
            grep -E 'problems? \(' "$OUT/lint.log" | tail -n 5 || true
            echo
            echo '## Install peer-dependency signals'
            if grep -Ei 'ERR_PNPM_PEER_DEP_ISSUES|Issues with peer dependencies found|unmet peer' "$OUT/pnpm-install.log"; then
              true
            else
              echo 'No peer-dependency error markers found in install log.'
            fi
            echo
            echo '## Braces patch smoke test'
            cat "$OUT/braces-smoke-test.log" 2>/dev/null || true
            echo
            echo '## Built route manifest spot-check'
            cat "$OUT/route-manifest-check.txt" 2>/dev/null || true
          } > "$OUT/SUMMARY.md"

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-${{ github.sha }}
          path: artifacts/phase1/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Phase 1 acceptance gates
        if: always()
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/artifacts/phase1"
          failed=0
          for name in typecheck test-unit test-ui build lint route-manifest-check; do
            code="$(awk -F '\t' -v n="$name" '$1 == n {print $2}' "$OUT/exit-codes.tsv" | tail -n 1)"
            if [[ "$code" != "0" ]]; then echo "::error::$name failed (exit ${code:-unknown})"; failed=1; fi
          done

          node - "$OUT/pnpm-audit.log" "$OUT/braces-smoke-test.log" <<'NODE'
          const fs = require('node:fs');
          const p = process.argv[2];
          const smokePath = process.argv[3];
          let data;
          try { data = JSON.parse(fs.readFileSync(p, 'utf8')); }
          catch (e) { console.error('Could not parse pnpm audit JSON:', e.message); process.exit(2); }
          const v = data.metadata?.vulnerabilities;
          if (!v) { console.error('Audit JSON has no metadata.vulnerabilities summary'); process.exit(2); }
          const highs = Object.values(data.advisories ?? {}).filter(a => a.severity === 'high');
          const allowed = highs.filter(a =>
            a.module_name === 'braces' &&
            a.url === 'https://github.com/advisories/GHSA-vfj7-8cjw-p6xm'
          );
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const patchPath = manifest.pnpm?.patchedDependencies?.['braces@3.0.3'];
          const patchExists = patchPath && fs.existsSync(patchPath);
          const documented = fs.existsSync('docs/audits/PHASE1-DEPENDENCY-EXCEPTIONS-2026-10-19.md');
          const smokePassed = fs.existsSync(smokePath) &&
            fs.readFileSync(smokePath, 'utf8').includes('braces backport smoke tests passed');
          console.log('Audit vulnerabilities:', JSON.stringify(v));
          console.log('High advisory modules:', highs.map(a => a.module_name + ' ' + a.url).join('; ') || 'none');
          if ((v.critical ?? 0) > 0 ||
              highs.length !== allowed.length ||
              allowed.length > 1 ||
              (allowed.length === 1 && !(patchExists && documented && smokePassed))) {
            console.error('Unmitigated critical/high advisory found, or braces exception prerequisites are missing.');
            process.exit(1);
          }
          if (allowed.length === 1) {
            console.log('Accepted documented exception: braces remains in registry audit metadata, but the exact version has a local patch and the depth-guard smoke test passed.');
          }
          NODE
          if [[ "$?" != "0" ]]; then echo "::error::pnpm audit has an unmitigated critical/high advisory; only the documented and smoke-tested braces exception is permitted"; failed=1; fi

          if grep -Eqi 'ERR_PNPM_PEER_DEP_ISSUES|Issues with peer dependencies found|unmet peer' "$OUT/pnpm-install.log"; then
            echo "::error::Peer dependency issue marker found in pnpm install log"
            failed=1
          fi
          lint_line="$(grep -E 'problems? \(' "$OUT/lint.log" | tail -n 1)"
          lint_warnings="$(printf '%s' "$lint_line" | sed -nE 's/.*\(([0-9]+) errors?, ([0-9]+) warnings?\).*/\2/p')"
          new_next_rule_count="$(grep -c '@next/next/no-location-assign-relative-destination' "$OUT/lint.log" || true)"
          if [[ -z "$lint_warnings" ]]; then
            echo "::error::Could not determine ESLint warning count"
            failed=1
          elif (( lint_warnings <= 218 )); then
            :
          elif (( lint_warnings == 220 )) && [[ "$new_next_rule_count" == "2" ]]; then
            echo "::notice::Two additional, unsuppressed Next 16.4.2 navigation warnings are documented for separate code remediation; no other lint-warning increase is accepted."
          else
            echo "::error::Lint warnings $lint_warnings exceed the baseline except for the explicitly documented two-warning Next 16.4.2 delta"
            failed=1
          fi
          if ! grep -q 'braces backport smoke tests passed' "$OUT/braces-smoke-test.log"; then
            echo "::error::Braces backport smoke test did not pass"
            failed=1
          fi
          exit "$failed"

# Validation revision: run the authorized Phase 1 remediation sequence.
