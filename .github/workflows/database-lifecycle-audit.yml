name: Database Lifecycle Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/database-lifecycle-audit.yml"
      - "scripts/database/data-lifecycle-*.ts"
      - "tests/unit/scripts/database/data-lifecycle-audit.test.ts"
      - "package.json"
      - "docs/architecture/database/data-lifecycle.md"
      - "src/lib/docsIndex.ts"

permissions:
  contents: read

jobs:
  database-lifecycle-audit:
    name: Read-only lifecycle inventory on ephemeral PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isolation_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isolation_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tenant isolation suite against disposable PostgreSQL
        run: pnpm run test:isolation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isolation_test_db
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isolation_test_db

      - name: Run read-only data lifecycle audit
        run: pnpm run db:lifecycle-audit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isolation_test_db
          DATABASE_LIFECYCLE_AUDIT_OUTPUT_PATH: artifacts/database-lifecycle-audit.json

      - name: Add inventory to job summary
        if: always()
        run: |
          if [ -f artifacts/database-lifecycle-audit.json ]; then
            echo "## Read-only database lifecycle inventory" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/database-lifecycle-audit.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lifecycle audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-lifecycle-audit-report
          path: artifacts/database-lifecycle-audit.json
          retention-days: 14
          if-no-files-found: ignore
