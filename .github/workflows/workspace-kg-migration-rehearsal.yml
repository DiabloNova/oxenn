name: Workspace KG Migration Rehearsal

on:
  workflow_dispatch:
    inputs:
      pr155_head_sha:
        description: "Exact reviewed head SHA of the still-open PR #155."
        type: string
        required: true
      confirm_rehearsal:
        description: "Confirm that only the protected isolated Workspace rehearsal database may be migrated."
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: oxenn-workspace-kg-pr155-migration-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Rehearse PR #155 migrations against an isolated Workspace branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: database-migration-rehearsal
    steps:
      - name: Require main and explicit rehearsal confirmation
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
          CONFIRM_REHEARSAL: ${{ inputs.confirm_rehearsal }}
          PR155_HEAD_SHA: ${{ inputs.pr155_head_sha }}
        run: |
          set -euo pipefail

          if [[ "$REQUESTED_REF" != "refs/heads/main" ]]; then
            echo "::error::Migration rehearsal may only be dispatched from main after PR #156 is merged."
            exit 1
          fi

          if [[ "$CONFIRM_REHEARSAL" != "true" ]]; then
            echo "::error::Set confirm_rehearsal to true to authorize the isolated rehearsal."
            exit 1
          fi

          if [[ ! "$PR155_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pr155_head_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Check out the current main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate the merged auditor PR and exact open PR #155 revision
        id: validate-revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
          PR155_HEAD_SHA: ${{ inputs.pr155_head_sha }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          async function getPull(number) {
            const response = await fetch(
              `https://api.github.com/repos/${process.env.REPOSITORY}/pulls/${number}`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              },
            );
            if (!response.ok) throw new Error(`GitHub could not verify PR #${number} (HTTP ${response.status}).`);
            return response.json();
          }

          (async () => {
            const repository = process.env.REPOSITORY;
            const [auditorPr, migrationPr] = await Promise.all([getPull(156), getPull(155)]);
            const requestedSha = process.env.PR155_HEAD_SHA.toLowerCase();

            if (
              auditorPr.state !== "closed" ||
              auditorPr.merged !== true ||
              auditorPr.base?.ref !== "main" ||
              auditorPr.head?.repo?.full_name !== repository ||
              !/^[0-9a-f]{40}$/.test(auditorPr.merge_commit_sha || "")
            ) {
              throw new Error("PR #156 must be merged into this repository's main branch before migration rehearsal.");
            }

            if (
              migrationPr.state !== "open" ||
              migrationPr.merged !== false ||
              migrationPr.draft === true ||
              migrationPr.base?.ref !== "main" ||
              migrationPr.head?.repo?.full_name !== repository ||
              migrationPr.head?.sha?.toLowerCase() !== requestedSha
            ) {
              throw new Error("PR #155 must remain open, non-draft, based on main, and at the exact supplied head SHA.");
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `pr156_merge_sha=${auditorPr.merge_commit_sha}\npr155_head_sha=${migrationPr.head.sha}\n`,
            );
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Require PR #156 merge to be part of this main checkout
        shell: bash
        env:
          PR156_MERGE_SHA: ${{ steps.validate-revisions.outputs.pr156_merge_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR156_MERGE_SHA" "$GITHUB_SHA" || {
            echo "::error::The checked-out main revision does not contain the merged PR #156 commit."
            exit 1
          }

      - name: Fetch and merge the exact PR #155 head without pushing
        shell: bash
        env:
          PR155_HEAD_SHA: ${{ steps.validate-revisions.outputs.pr155_head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/155/head
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$fetched_sha" != "$PR155_HEAD_SHA" ]]; then
            echo "::error::PR #155 changed after validation; restart with its current reviewed head SHA."
            exit 1
          fi

          # This merge is intentionally confined to the ephemeral Actions worktree.
          # Configure identity locally because --no-commit still needs a committer to
          # prepare the merge state on some Git versions.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff --no-commit "$fetched_sha"
          git diff --cached --check

          test -f database/drizzle/0018_kg_entity_canonical_resolution.sql
          test -f database/drizzle/0019_kg_relationship_tenant_integrity.sql
          echo "Validated an ephemeral combined worktree; no Git ref was updated."

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the exact isolated rehearsal endpoint and role boundaries
        shell: bash
        env:
          EXPECTED_REHEARSAL_HOST: ${{ vars.OXENN_WORKSPACE_REHEARSAL_ENDPOINT_HOST }}
          WORKSPACE_RUNTIME_URL: ${{ secrets.OXENN_WORKSPACE_RUNTIME_DATABASE_URL }}
          WORKSPACE_MIGRATION_URL: ${{ secrets.OXENN_WORKSPACE_MIGRATION_DATABASE_URL }}
          WORKSPACE_AUDIT_URL: ${{ secrets.OXENN_WORKSPACE_AUDIT_DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          const expectedHostRaw = (process.env.EXPECTED_REHEARSAL_HOST || "").trim().toLowerCase();
          const expectedHost = expectedHostRaw.endsWith(".") ? expectedHostRaw.slice(0, -1) : expectedHostRaw;
          if (!expectedHost || expectedHost.includes("-pooler.")) {
            console.error("The protected rehearsal environment must define OXENN_WORKSPACE_REHEARSAL_ENDPOINT_HOST.");
            process.exit(1);
          }

          const specs = [
            { label: "Workspace runtime", env: "WORKSPACE_RUNTIME_URL", role: "oxenn_workspace_runtime", kind: "runtime" },
            { label: "Workspace migrator", env: "WORKSPACE_MIGRATION_URL", role: "oxenn_workspace_migrator", kind: "migrator" },
            { label: "Workspace auditor", env: "WORKSPACE_AUDIT_URL", role: "oxenn_workspace_auditor", kind: "auditor" },
          ];

          const errors = [];
          const connections = [];

          for (const spec of specs) {
            const raw = process.env[spec.env];
            if (!raw) {
              errors.push(`${spec.label}: required rehearsal-only secret is missing`);
              continue;
            }
            try {
              const url = new URL(raw);
              const database = decodeURIComponent(url.pathname.replace(/^\/+/, ""));
              const username = decodeURIComponent(url.username);
              const allowedParameters = new Set(["sslmode", "channel_binding"]);
              const seen = new Set();

              for (const [name] of url.searchParams.entries()) {
                const key = name.toLowerCase();
                if (seen.has(key) || !allowedParameters.has(key)) {
                  errors.push(`${spec.label}: unsupported or duplicate connection parameter`);
                }
                seen.add(key);
              }

              if (!["postgres:", "postgresql:"].includes(url.protocol) ||
                  database !== "oxenn_workspace" ||
                  username !== spec.role ||
                  !url.password ||
                  url.hostname.toLowerCase() !== expectedHost ||
                  url.hostname.toLowerCase().includes("-pooler.") ||
                  !["require", "verify-ca", "verify-full"].includes((url.searchParams.get("sslmode") || "").toLowerCase()) ||
                  url.hash) {
                errors.push(`${spec.label}: URL does not match the exact protected rehearsal endpoint, database, role, and TLS contract`);
              } else {
                connections.push({ raw, spec });
              }
            } catch {
              errors.push(`${spec.label}: malformed PostgreSQL URL`);
            }
          }

          if (errors.length) {
            for (const error of errors) console.error(error);
            process.exit(1);
          }

          async function verifyConnection({ raw, spec }) {
            const client = new Client({
              connectionString: raw,
              connectionTimeoutMillis: 10000,
              statement_timeout: 15000,
              application_name: "oxenn-kg-migration-rehearsal-preflight",
            });
            let connected = false;
            try {
              await client.connect();
              connected = true;
              const result = await client.query(`
                SELECT
                  current_database() AS database_name,
                  current_user AS role_name,
                  role_record.rolcanlogin AS can_login,
                  role_record.rolsuper AS is_superuser,
                  role_record.rolcreatedb AS can_create_database,
                  role_record.rolcreaterole AS can_create_role,
                  role_record.rolreplication AS can_replicate,
                  role_record.rolbypassrls AS bypasses_rls,
                  role_record.rolinherit AS inherits_roles,
                  has_database_privilege(current_user, 'oxenn_platform_admin', 'CONNECT') AS can_connect_platform_admin,
                  has_database_privilege(current_user, 'oxenn_workspace', 'CREATE') AS can_create_in_database,
                  has_schema_privilege(current_user, 'public', 'USAGE') AS can_use_public,
                  has_schema_privilege(current_user, 'public', 'CREATE') AS can_create_in_public,
                  current_setting('default_transaction_read_only') AS default_transaction_read_only,
                  ARRAY(
                    SELECT member_role.rolname::text
                    FROM pg_roles AS member_role
                    WHERE member_role.oid <> role_record.oid
                      AND pg_has_role(role_record.oid, member_role.oid, 'MEMBER')
                    ORDER BY member_role.rolname
                  ) AS role_memberships,
                  (
                    SELECT COUNT(*)::int
                    FROM pg_default_acl AS default_acl
                    JOIN pg_namespace AS namespace ON namespace.oid = default_acl.defaclnamespace
                    WHERE namespace.nspname = 'public'
                      AND default_acl.defaclrole = role_record.oid
                  ) AS default_acl_entries,
                  (SELECT extversion FROM pg_extension WHERE extname = 'vector') AS vector_version
                FROM pg_roles AS role_record
                WHERE role_record.rolname = current_user
              `);

              const row = result.rows[0];
              if (!row ||
                  row.database_name !== "oxenn_workspace" ||
                  row.role_name !== spec.role ||
                  row.can_login !== true ||
                  row.is_superuser !== false ||
                  row.can_create_database !== false ||
                  row.can_create_role !== false ||
                  row.can_replicate !== false ||
                  row.can_connect_platform_admin !== false ||
                  row.can_use_public !== true ||
                  (spec.kind !== "runtime" &&
                    (!Array.isArray(row.role_memberships) || row.role_memberships.length !== 0))) {
                throw new Error("role identity or least-privilege checks failed");
              }

              if (spec.kind === "auditor") {
                if (row.bypasses_rls !== true ||
                    row.inherits_roles !== false ||
                    row.default_transaction_read_only !== "on" ||
                    row.can_create_in_database !== false ||
                    row.can_create_in_public !== false) {
                  throw new Error("auditor is not a dedicated BYPASSRLS read-only role");
                }
              } else {
                if (row.bypasses_rls !== false) {
                  throw new Error("runtime and migrator roles must never have BYPASSRLS");
                }
                const shouldCreate = spec.kind === "migrator";
                if (row.can_create_in_database !== shouldCreate ||
                    row.can_create_in_public !== shouldCreate) {
                  throw new Error("runtime/migrator database and schema grants do not match the migration contract");
                }
                if (spec.kind === "migrator" && row.default_acl_entries < 2) {
                  throw new Error("migrator is missing its expected future table/sequence default grants");
                }
                if (spec.kind === "runtime" && row.vector_version == null) {
                  throw new Error("pgvector is not installed in the Workspace rehearsal database");
                }
              }
            } finally {
              if (connected) await client.end();
            }
          }

          (async () => {
            for (const entry of connections) await verifyConnection(entry);
            console.log("Verified three dedicated Workspace roles on the explicitly pinned rehearsal endpoint.");
          })().catch((error) => {
            console.error(`Rehearsal connection preflight failed: ${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Validate Workspace migration environment
        env:
          NODE_ENV: production
          APP_MODE: migrate
          DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_RUNTIME_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_MIGRATION_DATABASE_URL }}
        run: pnpm run env:check migrate

      - name: Validate the combined Drizzle migration chain
        env:
          DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_RUNTIME_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_MIGRATION_DATABASE_URL }}
        run: pnpm exec drizzle-kit check --config=drizzle.config.ts

      - name: Run the global read-only integrity audit before migrations
        env:
          OXENN_WORKSPACE_AUDIT_DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_AUDIT_DATABASE_URL }}
        run: pnpm db:kg-integrity audit

      - name: Apply Workspace migrations to the isolated rehearsal branch
        env:
          NODE_ENV: production
          APP_MODE: migrate
          DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_RUNTIME_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.OXENN_WORKSPACE_MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Revalidate PR #155 after migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR155_HEAD_SHA: ${{ steps.validate-revisions.outputs.pr155_head_sha }}
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(
              `https://api.github.com/repos/${process.env.REPOSITORY}/pulls/155`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              },
            );
            if (!response.ok) throw new Error(`Could not revalidate PR #155 (HTTP ${response.status}).`);
            const pr = await response.json();
            if (pr.state !== "open" ||
                pr.merged !== false ||
                pr.draft === true ||
                pr.base?.ref !== "main" ||
                pr.head?.repo?.full_name !== process.env.REPOSITORY ||
                pr.head?.sha?.toLowerCase() !== process.env.PR155_HEAD_SHA.toLowerCase()) {
              throw new Error("PR #155 was closed, merged, retargeted, drafted, or updated while rehearsal was running; this rehearsal is not valid for the current PR head.");
            }
            console.log("PR #155 is still open at the exact rehearsed head SHA.");
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Record rehearsal result
        if: success()
        env:
          PR155_HEAD_SHA: ${{ steps.validate-revisions.outputs.pr155_head_sha }}
          MAIN_SHA: ${{ github.sha }}
          REHEARSAL_HOST: ${{ vars.OXENN_WORKSPACE_REHEARSAL_ENDPOINT_HOST }}
        run: |
          {
            echo "## Workspace KG migration rehearsal"
            echo
            printf -- '- Main revision (includes merged PR #156): %s\n' "$MAIN_SHA"
            printf -- '- Exact PR #155 revision rehearsed: %s\n' "$PR155_HEAD_SHA"
            printf -- '- Protected rehearsal endpoint: %s\n' "$REHEARSAL_HOST"
            echo "- Migrations 0018 and 0019: applied to the isolated rehearsal branch"
            echo "- PR #155: remains open and unmerged"
            echo "- Production: not accessed"
            echo
            echo "The combined source tree existed only in this runner. No Git branch or ref was updated."
            echo "After the DBA grants the four canonical-resolution columns to the rehearsal auditor, run the separate read-only Backfill dry-run and review its result before considering PR #155 merge-ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure warning
        if: failure()
        run: |
          {
            echo "## Workspace KG migration rehearsal did not complete"
            echo
            echo "Inspect the failed step and the rehearsal database's migration ledger before retrying. A successful migration step is not rolled back merely because a later validation or reporting step fails."
            echo "If PR #155 changed after migrations began, discard/reset the rehearsal branch from a clean main-derived snapshot before attempting a new head SHA."
            echo "Production credentials are not available to this workflow. Do not merge PR #155 or mark rehearsal as passed unless the exact head SHA and all required checks are verified."
          } >> "$GITHUB_STEP_SUMMARY"
